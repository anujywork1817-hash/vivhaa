server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router handles unknown paths client-side, so
    # every route that isn't a real file resolves to index.html instead of
    # nginx's default 404 — otherwise a refresh on any admin route but "/"
    # breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames (Vite's default) are safe to cache hard; index.html
    # itself must not be, or a redeploy stays invisible until the cache
    # expires.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
