services:
  # Self-hosted TURN relay for WebRTC video calls (internal/calls) — the
  # fallback when direct P2P fails (symmetric NAT, strict firewalls).
  # STUN alone (Google's public server, used by default) covers most
  # connections; this only matters for the ones that need a relay.
  #
  # --static-auth-secret must match TURN_SECRET so the backend's
  # generateTURNCredentials (HMAC-based, coturn's standard REST API
  # mechanism) produces credentials coturn actually accepts.
  #
  # Explicit port publishing (not network_mode: host): host networking
  # only reaches the real LAN on native Linux — on Docker Desktop for
  # Windows/Mac (WSL2/Hyper-V), "host" networking is scoped to the VM,
  # not the actual host NIC, so a phone on the same WiFi could never
  # reach it. The relay port range must be published individually since
  # coturn allocates one per active call from --min-port..--max-port.
  # --external-ip is required for the same VM-vs-host-NIC reason: without
  # it, coturn advertises its internal Docker IP in the ICE candidates it
  # hands back, which is meaningless to a device outside the container —
  # it needs to advertise the LAN IP other devices actually connect to.
  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "40000-40040:40000-40040/udp"
    command: >
      -n --log-file=stdout
      --listening-port=3478
      --tls-listening-port=5349
      --min-port=40000
      --max-port=40040
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:-dev-turn-secret-change-me}
      --realm=${TURN_REALM:-matrimony.local}
      --external-ip=${TURN_EXTERNAL_IP:-192.168.1.47}
      --no-cli

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-myapp}
    ports:
      - "${DB_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-myapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    ports:
      - "${S3_HOST_PORT:-59000}:9000"
      - "${S3_CONSOLE_HOST_PORT:-59001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin123} &&
      mc mb -p local/${S3_BUCKET:-matrimony-photos} &&
      mc anonymous set download local/${S3_BUCKET:-matrimony-photos}
      "
    restart: "no"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_HOST_PORT:-52181}:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:59092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-59092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_HOST_PORT:-59092}:59092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ES_HOST_PORT:-59200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database",
        "postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-myapp}?sslmode=disable",
        "up"
      ]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment: &app-env
      APP_ENV: ${APP_ENV:-dev}
      HTTP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-myapp}
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      S3_ENDPOINT: http://minio:9000
      # Presigned document URLs go to an admin's browser, not another
      # container — they must be signed against an address the browser
      # can reach, same reasoning as S3_PUBLIC_BASE_URL below.
      S3_PUBLIC_ENDPOINT: http://${S3_PUBLIC_HOST:-localhost}:${S3_HOST_PORT:-59000}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-matrimony-photos}
      # Private bucket for verification documents (BUG-C06) — never given
      # a public-read policy, unlike S3_BUCKET above. Only ever accessed
      # via short-lived presigned URLs minted at read time.
      S3_DOCS_BUCKET: ${S3_DOCS_BUCKET:-matrimony-verification-docs}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_USE_PATH_STYLE: "true"
      # Host used in photo URLs handed to clients. Must be an address the
      # *client device* can reach — "localhost" resolves to the phone
      # itself on a real device, so uploaded photos could never load.
      # Override S3_PUBLIC_HOST with the dev machine's LAN IP.
      S3_PUBLIC_BASE_URL: http://${S3_PUBLIC_HOST:-localhost}:${S3_HOST_PORT:-59000}/${S3_BUCKET:-matrimony-photos}
      KAFKA_BROKERS: kafka:9092
      ES_ADDRESSES: http://elasticsearch:9200
      ES_INDEX_NAME: ${ES_INDEX_NAME:-profiles}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS:-}
      # Comma-separated browser origin allowlist. configs.CORSConfig reads
      # this, but it was never passed through to the container — so a prod
      # deploy silently kept the dev "allow all origins" default no matter
      # what the host .env said. Unset still means allow-all, as before.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      # Firebase service-account key for push notifications. Leave unset
      # and the notification worker logs pushes instead of delivering them.
      FCM_CREDENTIALS_JSON: ${FCM_CREDENTIALS_JSON:-}
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      # coturn runs with network_mode: host, so it's reachable at the
      # docker host's own address, not a service DNS name like the other
      # containers here.
      STUN_SERVER_URL: ${STUN_SERVER_URL:-stun:stun.l.google.com:19302}
      # "localhost" here would resolve to the client device itself, not
      # this machine — must be a LAN IP a real phone can actually reach.
      TURN_SERVER_URL: ${TURN_SERVER_URL:-turn:192.168.1.47:3478}
      TURN_SECRET: ${TURN_SECRET:-dev-turn-secret-change-me}
    ports:
      - "${API_HOST_PORT:-58080}:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *app-env

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *app-env

  notification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *app-env
    volumes:
      # The Firebase service-account key is mounted rather than baked into
      # the image: the final build stage copies only the binary, so a path
      # under configs/ wouldn't exist at runtime — and secrets shouldn't
      # live in an image layer regardless. Read-only; the worker only reads it.
      - ./configs/secrets:/app/configs/secrets:ro

  # One-off ops tool: rebuilds the Elasticsearch index from every profile
  # row in Postgres. Run with `docker compose run --rm reindex` after a
  # database restore/migration onto a fresh ES, or any time the index and
  # the DB have otherwise drifted out of sync. Never runs on its own
  # (profiles: [tools]), same as seed below.
  reindex:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: reindex
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment: *app-env
    profiles:
      - tools

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: seed
    depends_on:
      api:
        condition: service_started
    environment:
      SEED_API_BASE_URL: http://api:8080
      SEED_MALE_COUNT: ${SEED_MALE_COUNT:-25}
      SEED_FEMALE_COUNT: ${SEED_FEMALE_COUNT:-25}
    profiles:
      - tools

  # Admin panel — static React/Vite build served by nginx. The API URL is
  # baked in at image build time (Vite inlines import.meta.env.* into the
  # bundle), so changing it means rebuilding this image, not just restarting
  # the container.
  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${ADMIN_API_BASE_URL:-http://192.168.1.222:58080}
    restart: unless-stopped
    ports:
      - "${ADMIN_HOST_PORT:-5173}:80"

volumes:
  postgres_data:
  minio_data:
  es_data:
