name: shaadi_clone
description: Premium AI-powered matrimonial platform — original UI, mock-backed frontend.
publish_to: "none"
version: 0.1.0+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0
  app_links: ^6.3.3

  # Networking (ready for real backend; mock services used for now)
  dio: ^5.5.0
  web_socket_channel: ^3.0.1
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  geolocator: ^13.0.1

  # Video calling (raw WebRTC — internal/calls signals over the existing
  # chat WebSocket, no third-party video SDK)
  flutter_webrtc: ^1.6.0
  permission_handler: ^11.3.1

  # Push notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # Modeling
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  # Auth
  google_sign_in: ^6.2.1

  # Payments
  razorpay_flutter: ^1.3.7

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  cached_network_image: ^3.4.1
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  responsive_framework: ^1.4.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  intl: ^0.19.0
  showcaseview: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
